[project]
name = "private-ledger-backend"
version = "0.1.0"
description = "FastAPI backend for Private Ledger"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi==25.1.0",
  "fastapi==0.116.1",
  "pyjwt==2.10.1",
  "sqlalchemy==2.0.44",
  "uvicorn[standard]==0.35.0"
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pyright==1.1.405",
  "pytest==8.4.2"
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pyright]
pythonVersion = "3.12"
include = ["app", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
